function header(){return `<div class="topbar"><h1 class="brand">👑 프렌드프렌드</h1><span class="pill">실시간 온라인</span></div>`}
function homeView(){const pre=new URLSearchParams(location.search).get('room')||'';return `${header()}<p class="sub">왕의 마음을 읽고, 평가를 받아 꼭대기까지 올라가세요!</p>${pre?`<div class="notice">초대받은 방 <b>${esc(pre)}</b> · 닉네임과 색을 고른 뒤 아래 입장을 눌러 주세요.</div>`:''}<section class="panel"><div class="field"><label>닉네임</label><input id="nickname" maxlength="10" placeholder="닉네임을 입력하세요" value="${esc(nickname)}"></div><div class="field"><label>아바타 색상</label><div class="colors">${COLORS.map((c,i)=>`<button class="swatch" style="background:${c}" aria-label="색상 ${i+1}" aria-pressed="${i===color}" onclick="window.setColor(${i})"></button>`).join('')}</div></div><div class="row"><button onclick="window.createRoom()">방 만들기</button></div><div class="field"><label>방 코드로 입장</label><div class="row"><input id="joincode" maxlength="4" placeholder="방 코드 4자리" value="${esc(pre)}"><button class="fit" onclick="window.joinRoom()">입장</button></div></div>${notice?`<p class="error">${esc(notice)}</p>`:''}<p class="muted">최대 ${MAX_PLAYERS}명 · 로그인 없이 참여 · 초대 링크 공유 가능</p></section>`}
function lobbyView(){const players=state.players||{},ready=ids(state).length>=2&&ids(state).every(id=>players[id].ready);return `${header()}<section class="panel center"><div class="muted">방 코드</div><div class="roomcode">${esc(roomCode)}</div><button class="smallbtn" onclick="window.copyInvite()">초대 링크 복사</button><p class="muted">친구에게 링크를 보내거나 방 코드를 알려주세요.</p></section><section class="panel">${state.msg?`<div class="notice">${esc(state.msg)}</div>`:''}<h2>참가자 (${ids(state).length}/${MAX_PLAYERS})</h2>${ids(state).map(id=>`<div class="player">${playerChip(players[id])}<span class="pill ${id===state.hostUid?'king':players[id].ready?'ok':''}">${id===state.hostUid?'방장':players[id].ready?'준비 완료':'준비 중'}</span>${id===uid?'<span class="pill">나</span>':''}</div>`).join('')}<div class="row" style="margin-top:14px">${isHost()?`<button onclick="window.startGame()" ${ready?'':'disabled'}>게임 시작</button>`:`<button onclick="window.toggleReady()">${myPlayer()?.ready?'준비 취소':'준비 완료'}</button>`}<button class="fit" onclick="window.leaveRoom()">나가기</button></div>${isHost()&&!ready?'<p class="muted">2명 이상 참가하고 모두 준비하면 시작할 수 있어요.</p>':''}${notice?`<p class="error">${esc(notice)}</p>`:''}</section>`}
function stairsHtml(){const T=state.top||topFor(ids(state).length);let out='';for(let n=T;n>=0;n--){const occupants=ids(state).filter(id=>id!==state.kingUid&&(state.players[id].position||0)===n);out+=`<div class="step ${n===T?'final':''}"><span class="num">${n===T?'최종':n}</span>${n===T?'👑 ':''}${occupants.map(id=>playerChip(state.players[id])).join(' ')||'<span style="opacity:.45">　</span>'}</div>`;}return out}
function historyHtml(){const arr=(state.history||[]).slice().reverse();return arr.length?arr.map(h=>`<div class="history-item ${h.rating<2?'bad':''}"><b>${esc(h.question)}</b><p><strong>참가자 답변:</strong> ${esc(h.playerAnswer)}</p><span class="pill ${h.rating>=2?'ok':''}">${h.rating>=2?'승인됨':'거절됨'} · 왕의 평가: ${RATINGS[h.rating]}</span></div>`).join(''):'<p class="muted">아직 완료된 질문이 없습니다.</p>'}
function activeHtml(){const queue=state.queue||[],first=queue[0],mine=queue.find(q=>q.askerUid===uid);
 if(state.phase==='end')return `<div class="panel center"><div style="font:30px Jua">👑 ${esc(state.players[state.winnerUid]?.name||'플레이어')} 승리!</div><p>다음 판의 왕이 됩니다.</p><button onclick="window.restartGame()">다시하기</button><button onclick="window.leaveRoom()">나가기</button></div>`;
 if(isKing()){
  if(!first)return `<div class="notice">새 질문을 기다리는 중입니다. 다른 참가자가 질문을 보내면 여기에 표시됩니다.</div>`;
  const gone=!state.players[first.askerUid];
  if(gone||!first.answer)return `<div class="question-card"><span class="pill">${gone?'참가자가 나갔어요':'답변 기다리는 중'}</span><h3>${esc(first.question)}</h3>${gone?'<button onclick="window.skipQuestion()">다음 질문으로</button>':'<p class="muted">참가자가 답변을 보내면 바로 평가할 수 있어요.</p>'}</div>`;
  return `<div class="question-card"><span class="pill">평가 차례</span><h3>${esc(first.question)}</h3><p><b>참가자의 답변</b><br>${esc(first.answer)}</p><h3>어떻게 평가할까요?</h3><div class="rating-grid">${RATINGS.map((v,i)=>`<button onclick="window.rateAnswer(${i})">${v}<br><small>${i===0?'1칸 아래 · 새 질문':i===1?'그대로 · 같은 질문':i===2?'1칸 위 · 새 질문':'2칸 위 · 새 질문'}</small></button>`).join('')}</div></div>`;
 }
 if(mine&&!mine.answer)return `<div class="question-card"><span class="pill">${mine.re?'재질문':'내 질문'}</span><h3>${esc(mine.question)}</h3><textarea id="qanswer" maxlength="180" placeholder="답변을 입력하세요"></textarea><button style="margin-top:8px" onclick="window.submitAnswer()">답변 전송</button></div>`;
 if(mine)return `<div class="notice">답변을 보냈어요. 왕의 평가를 기다리는 중입니다.</div>`;
 return `<div class="question-card"><span class="pill">질문 보내기</span><label for="questionSelect"><b>질문 주제 선택</b></label><div class="row"><select id="questionSelect">${promptHtml()}</select><button type="button" class="fit smallbtn" onclick="window.randomQ()">🎲 랜덤</button></div><label for="customquestion" style="display:block;margin-top:10px"><b>직접 질문하기 (선택)</b></label><textarea id="customquestion" maxlength="120" placeholder="직접 질문을 쓰면 선택한 질문 대신 전송됩니다."></textarea><label for="qanswer" style="display:block;margin-top:10px"><b>질문에 대한 내 답변</b></label><textarea id="qanswer" maxlength="180" placeholder="답변을 입력하세요"></textarea><button style="margin-top:8px" onclick="window.sendQuestion()">왕에게 보내기</button></div>`;
}
function gameView(){const king=state.players[state.kingUid];return `${header()}<section class="panel"><div class="topbar"><div><span class="pill king">현재 왕</span><h2 style="margin:5px 0">👑 ${esc(king?.name||'왕')}</h2></div><div class="row" style="flex:0 1 auto"><span class="pill">방 ${esc(roomCode)}</span><button class="smallbtn" onclick="window.copyInvite()">초대 링크</button><button class="smallbtn" onclick="window.leaveRoom()">나가기</button></div></div><p class="muted">매우 싫음: 1칸 아래 · 싫음: 유지 · 좋음: 1칸 위 · 매우 좋음: 2칸 위</p></section><div class="gamegrid"><section class="panel"><h2>플레이어 계단</h2><div class="stairs">${stairsHtml()}</div></section><section class="panel"><h2>진행 상황</h2>${activeHtml()}<h2 style="margin-top:22px">질문 기록</h2><p class="muted">질문자 닉네임은 공개되지 않습니다.</p><div class="history">${historyHtml()}</div></section></div>`}
const FIELDS=['nickname','joincode','qanswer','customquestion','questionSelect'];
function render(){const keep={},ae=document.activeElement;FIELDS.forEach(i=>{const e=document.getElementById(i);if(e)keep[i]={v:e.value,f:e===ae,a:e.selectionStart,b:e.selectionEnd}});
if(!uid)app.innerHTML=`<section class="panel center"><h1 class="brand">👑 프렌드프렌드</h1><p>익명 접속을 준비하고 있어요…</p></section>`;
else if(!state)app.innerHTML=homeView();
else{app.innerHTML=state.phase==='lobby'?lobbyView():gameView();if(notice&&state.phase!=='lobby')app.insertAdjacentHTML('beforeend',`<div class="toast">${esc(notice)}</div>`)}
FIELDS.forEach(i=>{const k=keep[i],e=document.getElementById(i);if(!k||!e)return;e.value=k.v;if(e.tagName==='SELECT'&&e.selectedIndex<0)e.selectedIndex=0;if(k.f){e.focus();try{e.setSelectionRange(k.a,k.b)}catch(_){}}})}
function fail(e){console.error(e);flash(e?.message||'오류가 발생했어요. 다시 시도해 주세요.')}
async function transact(fn){if(!roomRef||busy) return;busy=true;const to=setTimeout(()=>{busy=false},8000);try{const result=await roomRef.transaction(room=>{if(!room)return room;return fn(room)||room});if(!result.committed)throw new Error('상태가 변경되어 요청을 처리하지 못했어요. 화면을 새로 확인해 주세요.');}catch(e){fail(e)}finally{clearTimeout(to);busy=false}}
function watchRoom(ref){stopWatch();roomRef=ref;cb=snap=>{if(leaving)return;state=snap.val();const gone=!state||state.phase==='closed',lost=!gone&&!state.players?.[uid];if(gone||lost){stopRoom();notice=lost?'연결이 끊겨 방에서 나가졌어요.':'방이 종료되었습니다.';render();return}render()};ref.on('value',cb,e=>fail(e));startPresence()}
function stopWatch(){if(roomRef&&cb)roomRef.off('value',cb);cb=null;stopPresence()}
function startPresence(){const c=roomCode;connRef=db.ref('.info/connected');connCb=s=>{if(s.val()===true){const p=db.ref('presence/'+c+'/'+uid);p.onDisconnect().remove().then(()=>p.set(Date.now())).catch(()=>{})}};connRef.on('value',connCb);presRef=db.ref('presence/'+c);presCb=s=>{pres=s.val()||{}};presRef.on('value',presCb);tick=setInterval(sweep,5000)}
function stopPresence(){clearInterval(tick);tick=null;if(connRef&&connCb)connRef.off('value',connCb);if(presRef&&presCb)presRef.off('value',presCb);connRef=presRef=connCb=presCb=null;pres={};absent={}}
function sweep(){if(!state||!roomRef)return;const now=Date.now(),gone=[];ids(state).forEach(i=>{if(i===uid||pres[i])delete absent[i];else{absent[i]=absent[i]||now;if(now-absent[i]>=25000)gone.push(i)}});if(gone.length)roomRef.transaction(r=>{if(!r)return r;gone.forEach(i=>{if(r.players)delete r.players[i]});return normalize(r)}).catch(()=>{})}
function normalize(r){const P=r.players||{};Object.keys(P).forEach(i=>{if(!P[i]||!P[i].name)delete P[i]});const left=Object.keys(P);if(!left.length)return null;r.players=P;
if(!P[r.hostUid]){r.hostUid=left[0];if(r.phase==='lobby')P[left[0]].ready=true}
if(r.phase!=='lobby'&&(left.length<2||!P[r.kingUid]||(r.phase==='end'&&!P[r.winnerUid]))){r.phase='lobby';r.kingUid=null;r.current=null;r.queue=[];r.history=[];r.winnerUid=null;r.msg='사람이 나가서 대기실로 돌아왔어요.';left.forEach(i=>{P[i].ready=i===r.hostUid;P[i].position=0})}
else if(r.phase==='play'){r.queue=(r.queue||[]).filter(x=>P[x.askerUid]);if(r.current&&!P[r.current.askerUid])r.current=null}
return r}
function stopRoom(){stopWatch();roomRef=null;state=null;roomCode=null;history.replaceState({},'',location.pathname);}
async function createRoom(){nickname=safeText($('#nickname')?.value,10)||'친구'+Math.floor(Math.random()*90+10);try{for(let i=0;i<8;i++){const c=code4(),ref=db.ref('rooms/'+c);const res=await ref.transaction(r=>r?undefined:{hostUid:uid,phase:'lobby',players:{[uid]:{name:nickname,color,ready:true,position:0}},kingUid:null,queue:[],current:null,history:[],winnerUid:null,createdAt:Date.now()});if(res.committed){roomCode=c;history.replaceState({},'','?room='+c);watchRoom(ref);notice='';return}}throw new Error('방 코드를 만들지 못했어요. 다시 시도해 주세요.')}catch(e){fail(e)}}
async function joinRoom(){nickname=safeText($('#nickname')?.value,10)||'친구'+Math.floor(Math.random()*90+10);const c=safeText($('#joincode')?.value,4).toUpperCase();if(!/^[A-Z0-9]{4}$/.test(c)){flash('방 코드는 영문 또는 숫자 4자리로 입력해 주세요.');return}try{const ref=db.ref('rooms/'+c);let ok=false,why='';const result=await ref.transaction(r=>{if(!r){why='방을 찾을 수 없습니다.';return r}if(!r.players)r.players={};const mine=r.players[uid];if(!mine&&r.phase!=='lobby'){why='이미 게임이 시작된 방입니다.';return}if(!mine&&Object.keys(r.players).length>=MAX_PLAYERS){why='방 인원이 가득 찼습니다.';return}if(!mine)r.players[uid]={name:nickname,color,ready:false,position:0};ok=true;return r});if(!result.committed||!ok)throw new Error(why||'방에 입장하지 못했습니다.');roomCode=c;history.replaceState({},'','?room='+c);watchRoom(ref);notice='';}catch(e){fail(e)}}
async function toggleReady(){await transact(r=>{if(r.phase!=='lobby'||!r.players?.[uid])return r;r.players[uid].ready=!r.players[uid].ready;return r})}
async function startGame(){await transact(r=>{const players=Object.keys(r.players||{});if(r.hostUid!==uid||r.phase!=='lobby'||players.length<2||!players.every(id=>r.players[id].ready))return r;const king=players[Math.floor(Math.random()*players.length)];players.forEach(id=>{r.players[id].position=0});r.kingUid=king;r.top=topFor(players.length);r.phase='play';r.queue=[];r.history=[];r.used=[];r.winnerUid=null;r.msg=null;return r})}
async function sendQuestion(){const custom=safeText($('#customquestion')?.value,120),q=custom||safeText($('#questionSelect')?.value,120),a=safeText($('#qanswer')?.value,180);if(!q){flash('질문을 선택하거나 입력해 주세요.');return}if(!a){flash('답변을 입력해 주세요.');return}await transact(r=>{if(r.phase!=='play'||uid===r.kingUid||(r.queue||[]).some(x=>x.askerUid===uid))return r;r.queue=r.queue||[];r.queue.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),askerUid:uid,question:q,answer:a,re:false});r.used=[...(r.used||[]),q];return r})}
async function submitAnswer(){const a=safeText($('#qanswer')?.value,180);if(!a){flash('답변을 입력해 주세요.');return}await transact(r=>{if(r.phase!=='play')return r;const i=(r.queue||[]).findIndex(x=>x.askerUid===uid&&!x.answer);if(i<0)return r;r.queue[i].answer=a;return r})}
async function skipQuestion(){await transact(r=>{if(r.phase!=='play'||r.kingUid!==uid||!r.queue?.length)return r;if(r.players?.[r.queue[0].askerUid])return r;r.queue.shift();return r})}



async function rateAnswer(value){await transact(r=>{if(r.phase!=='play'||r.kingUid!==uid||!r.queue?.length)return r;const it=r.queue[0];if(!it.answer)return r;const P=r.players||{},p=P[it.askerUid];r.queue.shift();if(!p)return r;const top=r.top||topFor(Object.keys(P).length);const v=Math.max(0,Math.min(3,Number(value)));const old=Number(p.position)||0;let win=false;if(old===top&&v>=2){win=true;r.phase='end';r.winnerUid=it.askerUid}else{const move=old===top-1?Math.min(DELTA[v],1):DELTA[v];p.position=Math.max(0,Math.min(top,old+move))}r.history=r.history||[];r.history.push({question:it.question,playerAnswer:it.answer,rating:v,createdAt:Date.now()});if(!win){const q=v===1?it.question:pickQ(r.used,(P[r.kingUid]||{}).name||'왕');if(v!==1)r.used=[...(r.used||[]),q];r.queue.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),askerUid:it.askerUid,question:q,answer:'',re:true})}return r})}
async function restartGame(){await transact(r=>{if(r.phase!=='end'||!r.winnerUid||!r.players?.[r.winnerUid])return r;const nextKing=r.winnerUid;Object.values(r.players||{}).forEach(p=>{p.position=0});r.kingUid=nextKing;r.top=topFor(Object.keys(r.players).length);r.phase='play';r.queue=[];r.history=[];r.used=[];r.winnerUid=null;r.msg=null;return r})}
async function leaveRoom(){if(roomRef){leaving=true;const ref=roomRef,c=roomCode;try{await ref.transaction(r=>{if(!r)return r;if(r.players)delete r.players[uid];return normalize(r)});const p=db.ref('presence/'+c+'/'+uid);p.onDisconnect().cancel();p.remove()}catch(e){console.warn(e)}leaving=false}stopRoom();notice='';render()}
async function copyInvite(){const url=roomUrl(roomCode);try{await navigator.clipboard.writeText(url);flash('초대 링크를 복사했어요!')}catch(e){window.prompt('아래 링크를 복사해 친구에게 보내세요.',url)}}
window.setColor=i=>{color=i;render()};window.createRoom=createRoom;window.joinRoom=joinRoom;window.toggleReady=toggleReady;window.startGame=startGame;window.sendQuestion=sendQuestion;window.submitAnswer=submitAnswer;window.skipQuestion=skipQuestion;window.rateAnswer=rateAnswer;window.restartGame=restartGame;window.leaveRoom=leaveRoom;window.copyInvite=copyInvite;window.randomQ=()=>{const e=$('#questionSelect');if(e)e.selectedIndex=Math.floor(Math.random()*e.options.length)};
async function init(){try{const CFG=window.FRIENDFRIEND_FIREBASE_CONFIG||window.YOUSOME_FIREBASE_CONFIG;if(!CFG||!CFG.apiKey||CFG.apiKey==='YOUR_API_KEY'){app.innerHTML=`${header()}<section class="panel"><h2>온라인 게임 서버 설정이 필요합니다.</h2><p>게임 파일은 준비됐지만, 아직 공용 데이터베이스에 연결되지 않았습니다. Firebase 설정을 연결한 뒤 공개 웹사이트에 배포하면 링크로 접속할 수 있습니다.</p><p class="muted">설정 방법은 함께 제공된 README.md를 확인해 주세요.</p></section>`;return}firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.database();const cred=await auth.signInAnonymously();uid=cred.user.uid;render();}catch(e){console.error(e);app.innerHTML=`${header()}<section class="panel"><p class="error">서버 연결에 실패했습니다.</p><p>${esc(e.message||e)}</p><p class="muted">Firebase 익명 인증과 Realtime Database가 활성화되어 있는지 확인해 주세요.</p></section>`}}
init();
})();
</script></body></html>
