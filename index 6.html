 }
 if(mine&&!mine.answer)return `<div class="question-card"><span class="pill">${mine.re?'재질문':'랜덤 질문'}</span><h3>${esc(mine.question)}</h3><textarea id="qanswer" maxlength="180" placeholder="답변을 입력하세요"></textarea><button style="margin-top:8px" onclick="window.submitAnswer()">답변 보내기</button></div>`;
 if(mine)return `<div class="notice">답변을 보냈어요. 왕의 평가를 기다리는 중입니다.</div>`;
 const pq=(state.players[uid]||{}).pq;

function gameView(){const king=state.players[state.kingUid];return `${header()}<section class="panel"><div class="topbar"><div><span class="pill king">현재 왕</span><h2 style="margin:5px 0">👑 ${esc(king?.name||'왕')}</h2></div><div class="row" style="flex:0 1 auto"><span class="pill">방 ${esc(roomCode)}</span><button class="smallbtn" onclick="window.copyInvite()">초대 링크</button><button class="smallbtn" onclick="window.leaveRoom()">나가기</button></div></div><p class="muted">매우 싫음: 1칸 아래 · 싫음: 유지 · 좋음: 1칸 위 · 매우 좋음: 2칸 위</p></section><div class="gamegrid"><section class="panel"><h2>플레이어 계단</h2><div class="stairs">${stairsHtml()}</div></section><section class="panel"><h2>진행 상황</h2>${activeHtml()}<h2 style="margin-top:22px">질문 기록</h2><p class="muted">질문자 닉네임은 공개되지 않습니다.</p><div class="history">${historyHtml()}</div></section></div>`}
const FIELDS=['nickname','joincode','qanswer'];
function render(){const keep={},ae=document.activeElement;FIELDS.forEach(i=>{const e=document.getElementById(i);if(e)keep[i]={v:e.value,f:e===ae,a:e.selectionStart,b:e.selectionEnd}});

else{app.innerHTML=state.phase==='lobby'?lobbyView():gameView();if(notice&&state.phase!=='lobby')app.insertAdjacentHTML('beforeend',`<div class="toast">${esc(notice)}</div>`)}
FIELDS.forEach(i=>{const k=keep[i],e=document.getElementById(i);if(!k||!e)return;e.value=k.v;if(e.tagName==='SELECT'&&e.selectedIndex<0)e.selectedIndex=0;if(k.f){e.focus();try{e.setSelectionRange(k.a,k.b)}catch(_){}}})}
function fail(e){console.error(e);flash(e?.message||'오류가 발생했어요. 다시 시도해 주세요.')}
async function transact(fn){if(!roomRef||busy) return;busy=true;const to=setTimeout(()=>{busy=false},8000);try{const result=await roomRef.transaction(room=>{if(!room)return room;return fn(room)||room});if(!result.committed)throw new Error('상태가 변경되어 요청을 처리하지 못했어요. 화면을 새로 확인해 주세요.');}catch(e){fail(e)}finally{clearTimeout(to);busy=false}}
function watchRoom(ref){stopWatch();roomRef=ref;cb=snap=>{if(leaving)return;state=snap.val();const gone=!state||state.phase==='closed',lost=!gone&&!state.players?.[uid]&&!state.spectators?.[uid];if(gone||lost){stopRoom();notice=lost?'연결이 끊겨 방에서 나가졌어요.':'방이 종료되었습니다.';render();return}render()};ref.on('value',cb,e=>fail(e));startPresence()}
function stopWatch(){if(roomRef&&cb)roomRef.off('value',cb);cb=null;stopPresence()}
function startPresence(){const c=roomCode;connRef=db.ref('.info/connected');connCb=s=>{if(s.val()===true){const p=db.ref('presence/'+c+'/'+uid);p.onDisconnect().remove().then(()=>p.set(Date.now())).catch(()=>{})}};connRef.on('value',connCb);presRef=db.ref('presence/'+c);presCb=s=>{pres=s.val()||{}};presRef.on('value',presCb);tick=setInterval(sweep,5000)}
function stopPresence(){clearInterval(tick);tick=null;if(connRef&&connCb)connRef.off('value',connCb);if(presRef&&presCb)presRef.off('value',presCb);connRef=presRef=connCb=presCb=null;pres={};absent={}}
function sweep(){if(!state||!roomRef)return;const now=Date.now(),gone=[];[...ids(state),...Object.keys(state.spectators||{})].forEach(i=>{if(i===uid||pres[i])delete absent[i];else{absent[i]=absent[i]||now;if(now-absent[i]>=25000)gone.push(i)}});if(gone.length)roomRef.transaction(r=>{if(!r)return r;gone.forEach(i=>{if(r.players)delete r.players[i];if(r.spectators)delete r.spectators[i]});return normalize(r)}).catch(()=>{})}
function normalize(r){const P=r.players||{};Object.keys(P).forEach(i=>{if(!P[i]||!P[i].name)delete P[i]});const left=Object.keys(P);if(!left.length)return null;r.players=P;
if(!P[r.hostUid]){r.hostUid=left[0];if(r.phase==='lobby')P[left[0]].ready=true}
if(r.phase!=='lobby'&&(left.length<2||!P[r.kingUid]||(r.phase==='end'&&!P[r.winnerUid]))){r.phase='lobby';r.kingUid=null;r.current=null;r.queue=[];r.history=[];r.winnerUid=null;r.msg='사람이 나가서 대기실로 돌아왔어요.';promote(r,false);left.forEach(i=>{P[i].ready=i===r.hostUid;P[i].position=0})}
else if(r.phase==='play'){r.queue=(r.queue||[]).filter(x=>P[x.askerUid]);if(r.current&&!P[r.current.askerUid])r.current=null}
return r}
function stopRoom(){stopWatch();roomRef=null;state=null;roomCode=null;history.replaceState({},'',location.pathname);}
async function createRoom(){stopWatch();leaving=false;busy=false;roomRef=null;state=null;pendingJoin=null;nickname=safeText($('#nickname')?.value,2);if(!nickname){flash('닉네임을 입력해 주세요. (최대 2글자)');return}try{for(let i=0;i<8;i++){const c=code4(),ref=db.ref('rooms/'+c);const res=await ref.transaction(r=>r?undefined:{hostUid:uid,phase:'lobby',players:{[uid]:{name:nickname,color,ready:true,position:0}},kingUid:null,queue:[],current:null,history:[],winnerUid:null,createdAt:Date.now()});if(res.committed){roomCode=c;history.replaceState({},'','?room='+c);watchRoom(ref);notice='';return}}throw new Error('방 코드를 만들지 못했어요. 다시 시도해 주세요.')}catch(e){fail(e)}}
async function joinRoom(){const c=pendingJoin?pendingJoin.code:safeText($('#joincode')?.value,4).toUpperCase();nickname=safeText($('#nickname')?.value,2);if(!nickname){flash('닉네임을 입력해 주세요. (최대 2글자)');return}if(!/^[A-Z0-9]{4}$/.test(c)){flash('방 코드는 영문 또는 숫자 4자리로 입력해 주세요.');return}try{const ref=db.ref('rooms/'+c);let ok=false,why='';const result=await ref.transaction(r=>{if(!r){why='방을 찾을 수 없습니다.';return r}if(!r.players)r.players={};if(!r.spectators)r.spectators={};if(r.players[uid]||r.spectators[uid]){ok=true;return r}const P=Object.values(r.players),Sp=Object.values(r.spectators),all=[...P,...Sp];if(all.some(p=>p.name===nickname)){why='닉네임이 겹칩니다. 다른 닉네임을 써 주세요.';return}if(all.some(p=>p.color===color)){why='색이 겹칩니다. 다른 색을 골라 주세요.';return}if(r.phase!=='lobby'){r.spectators[uid]={name:nickname,color,position:0};ok=true;return r}if(P.length>=MAX_PLAYERS){why='방 인원이 가득 찼습니다.';return}r.players[uid]={name:nickname,color,ready:false,position:0};ok=true;return r});if(!result.committed||!ok)throw new Error(why||'방에 입장하지 못했습니다.');pendingJoin=null;roomCode=c;history.replaceState({},'','?room='+c);watchRoom(ref);notice='';}catch(e){fail(e)}}
async function toggleReady(){await transact(r=>{if(r.phase!=='lobby'||!r.players?.[uid])return r;r.players[uid].ready=!r.players[uid].ready;return r})}
async function startGame(){await transact(r=>{const players=Object.keys(r.players||{});if(r.hostUid!==uid||r.phase!=='lobby'||players.length<2||!players.every(id=>r.players[id].ready))return r;const cs=players.map(id=>r.players[id].color),nm=players.map(id=>r.players[id].name);if(new Set(nm).size!==nm.length){r.msg='닉네임이 겹치는 사람이 있어서 시작할 수 없어요.';return r}if(new Set(cs).size!==cs.length){r.msg='같은 색을 쓰는 사람이 있어서 시작할 수 없어요.';return r}const king=players[Math.floor(Math.random()*players.length)];players.forEach(id=>{r.players[id].position=0});r.kingUid=king;r.top=topFor(players.length);r.phase='play';r.queue=[];r.history=[];r.used=[];r.winnerUid=null;r.msg=null;assignQ(r);return r})}
async function sendQuestion(){const a=safeText($('#qanswer')?.value,180);if(!a){flash('답변을 입력해 주세요.');return}await transact(r=>{if(r.phase!=='play'||uid===r.kingUid||(r.queue||[]).some(x=>x.askerUid===uid))return r;const p=(r.players||{})[uid];if(!p||!p.pq)return r;r.queue=r.queue||[];r.queue.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),askerUid:uid,question:p.pq,answer:a,re:false});p.pq='';return r})}
async function submitAnswer(){const a=safeText($('#qanswer')?.value,180);if(!a){flash('답변을 입력해 주세요.');return}await transact(r=>{if(r.phase!=='play')return r;const i=(r.queue||[]).findIndex(x=>x.askerUid===uid&&!x.answer);if(i<0)return r;r.queue[i].answer=a;return r})}
async function skipQuestion(){await transact(r=>{if(r.phase!=='play'||r.kingUid!==uid||!r.queue?.length)return r;const gx=r.queue.findIndex(q=>!r.players?.[q.askerUid]);if(gx<0)return r;r.queue.splice(gx,1);return r})}



async function rateAnswer(value){await transact(r=>{if(r.phase!=='play'||r.kingUid!==uid||!r.queue?.length)return r;const ix=(r.queue||[]).findIndex(q=>q.answer);if(ix<0)return r;const it=r.queue[ix];const P=r.players||{},p=P[it.askerUid];r.queue.splice(ix,1);if(!p)return r;const top=r.top||topFor(Object.keys(P).length);const v=Math.max(0,Math.min(3,Number(value)));const old=Number(p.position)||0;let win=false;if(old===top&&v>=2){win=true;r.phase='end';r.winnerUid=it.askerUid}else{const move=old===top-1?Math.min(DELTA[v],1):DELTA[v];p.position=Math.max(0,Math.min(top,old+move))}r.history=r.history||[];r.history.push({question:it.question,playerAnswer:it.answer,rating:v,createdAt:Date.now()});if(!win){const q=v===1?it.question:pickQ(r.used,(P[r.kingUid]||{}).name||'왕');if(v!==1)r.used=[...(r.used||[]),q];r.queue.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),askerUid:it.askerUid,question:q,answer:'',re:true})}return r})}
async function restartGame(){await transact(r=>{if(r.phase!=='end'||!r.winnerUid||!r.players?.[r.winnerUid])return r;const nextKing=r.winnerUid;Object.values(r.players||{}).forEach(p=>{p.position=0});promote(r,true);r.kingUid=nextKing;r.top=topFor(Object.keys(r.players).length);r.phase='play';r.queue=[];r.history=[];r.used=[];r.winnerUid=null;r.msg=null;assignQ(r);return r})}
async function leaveRoom(){if(roomRef){leaving=true;const ref=roomRef,c=roomCode;try{await ref.transaction(r=>{if(!r)return r;if(r.players)delete r.players[uid];if(r.spectators)delete r.spectators[uid];return normalize(r)});const p=db.ref('presence/'+c+'/'+uid);p.onDisconnect().cancel();p.remove()}catch(e){console.warn(e)}leaving=false}stopRoom();notice='';render()}
async function copyInvite(){const url=roomUrl(roomCode);try{await navigator.clipboard.writeText(url);flash('초대 링크를 복사했어요!')}catch(e){window.prompt('아래 링크를 복사해 친구에게 보내세요.',url)}}
window.setColor=i=>{color=i;render()};window.goJoin=goJoin;window.backHome=backHome;window.setNick=setNick;window.createRoom=createRoom;window.joinRoom=joinRoom;window.toggleReady=toggleReady;window.startGame=startGame;window.sendQuestion=sendQuestion;window.submitAnswer=submitAnswer;window.skipQuestion=skipQuestion;window.rateAnswer=rateAnswer;window.restartGame=restartGame;window.leaveRoom=leaveRoom;window.copyInvite=copyInvite;window.randomQ=()=>{const e=$('#questionSelect');if(e)e.selectedIndex=Math.floor(Math.random()*e.options.length)};
window.setLobbyColor=setLobbyColor;
async function init(){try{const CFG=window.FRIENDFRIEND_FIREBASE_CONFIG||window.YOUSOME_FIREBASE_CONFIG;if(!CFG||!CFG.apiKey||CFG.apiKey==='YOUR_API_KEY'){app.innerHTML=`${header()}<section class="panel"><h2>온라인 게임 서버 설정이 필요합니다.</h2><p>게임 파일은 준비됐지만, 아직 공용 데이터베이스에 연결되지 않았습니다. Firebase 설정을 연결한 뒤 공개 웹사이트에 배포하면 링크로 접속할 수 있습니다.</p><p class="muted">설정 방법은 함께 제공된 README.md를 확인해 주세요.</p></section>`;return}firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.database();const cred=await auth.signInAnonymously();uid=cred.user.uid;cleanupRooms();render();}catch(e){console.error(e);app.innerHTML=`${header()}<section class="panel"><p class="error">서버 연결에 실패했습니다.</p><p>${esc(e.message||e)}</p><p class="muted">Firebase 익명 인증과 Realtime Database가 활성화되어 있는지 확인해 주세요.</p></section>`}}
init();
})();
</script></body></html>
